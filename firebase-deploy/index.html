<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Teenz Bible</title>
<style>
body{background:#0a1628;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
.c{padding:20px}
h2{color:#ffd700;margin-bottom:10px}
p{color:#94a3b8}
.s{width:40px;height:40px;border:4px solid #1e293b;border-top:4px solid #ffd700;border-radius:50%;animation:r 1s linear infinite;margin:15px auto}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="c">
<h2>Teenz Bible</h2>
<div class="s"></div>
<p>Updating to latest version...</p>
</div>
<script>
(async function(){
  try {
    if('serviceWorker' in navigator){
      var regs = await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<regs.length;i++){
        await regs[i].unregister();
      }
    }
    if(window.caches){
      var keys = await caches.keys();
      for(var i=0;i<keys.length;i++){
        await caches.delete(keys[i]);
      }
    }
  } catch(e) {}
  window.location.replace('/app.html');
})();
</script>
</body>
</html>
