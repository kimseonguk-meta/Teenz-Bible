<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 54" preserveAspectRatio="none">

<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff9c6"/>
    <stop offset=".18" stop-color="#ffd95d"/>
    <stop offset=".45" stop-color="#c97a10"/>
    <stop offset=".7" stop-color="#6a3505"/>
    <stop offset="1" stop-color="#f5b52a"/>
  </linearGradient>
  <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff2a0"/>
    <stop offset=".42" stop-color="#c8790d"/>
    <stop offset="1" stop-color="#2b1705"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#30333b"/>
    <stop offset=".46" stop-color="#171920"/>
    <stop offset="1" stop-color="#090a0f"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d293ff"/>
    <stop offset=".48" stop-color="#7a2bd1"/>
    <stop offset="1" stop-color="#32105d"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".7"/>
    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffcf45" flood-opacity=".25"/>
  </filter>
  <filter id="innerNoise">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9 0 0 0 0 0.75 0 0 0 0 0.45 0 0 0 .08 0"/>
    <feBlend mode="overlay" in2="SourceGraphic"/>
  </filter>
</defs>

<rect x="8" y="7" width="144" height="40" rx="10" fill="url(#dark)" stroke="#98590c" stroke-width="5" filter="url(#shadow)"/>
<rect x="16" y="13" width="128" height="27" rx="6" fill="none" stroke="#fff1a8" stroke-width="2" opacity=".28"/>
</svg>
