<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teenz Bible Phase 1 Brand Foundation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050c18;
      color: #fff8e8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      padding: 24px;
    }
    main { max-width: 1200px; margin: 0 auto; }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 0;
    }
    a {
      color: #ffe24d;
      text-decoration: none;
      padding: 10px 12px;
      border: 1px solid rgba(255,226,77,.24);
      border-radius: 999px;
      background: rgba(255,226,77,.08);
      font-weight: 800;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <img src="./phase-1-brand-foundation.png" alt="Teenz Bible Phase 1 Brand Foundation board" />
    <div class="links">
      <a href="./phase-1-brand-icon-assets.png">Brand icon assets board</a>
      <a href="./phase-1-brand-icon-sprite-no-labels.png">Label-free sprite sheet</a>
      <a href="./phase-1-brand-foundation.md">Phase 1 notes</a>
    </div>
  </main>
</body>
</html>
