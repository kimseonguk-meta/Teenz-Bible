<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Teenz Bible</title>
<script>
// CRITICAL: Kill old service worker and clear all caches
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  });
  if('caches' in window){
    caches.keys().then(function(names){
      names.forEach(function(n){ caches.delete(n); });
    });
  }
}
// Redirect to the new app after a brief delay to allow SW cleanup
setTimeout(function(){ window.location.replace('/'); }, 500);
</script>
</head>
<body style="background:#1a0e06;color:#d4a574;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
<p>Updating Teenz Bible...</p>
</body>
</html>
